name: eventbank

x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Production
  RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
  Authentication__MetadataAddress: http://keycloak:8080/realms/eventbank/.well-known/openid-configuration
  Authentication__ValidIssuer: http://localhost:8180/realms/eventbank
  Authentication__Audience: eventbank-api

x-service-dependencies: &service-dependencies
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: eventbank
      POSTGRES_PASSWORD: eventbank
    ports:
      - "55432:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbank"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"

  keycloak:
    image: ghcr.io/marcelo-roman/eventbank-identity:latest
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: eventbank
      KC_DB_PASSWORD: eventbank
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  customers:
    image: ghcr.io/marcelo-roman/eventbank-customers:latest
    environment:
      <<: *service-environment
      ConnectionStrings__Customers: Host=postgres;Database=customers;Username=eventbank;Password=eventbank;GSS Encryption Mode=Disable
    depends_on: *service-dependencies

  accounts:
    image: ghcr.io/marcelo-roman/eventbank-accounts:latest
    environment:
      <<: *service-environment
      ConnectionStrings__Accounts: Host=postgres;Database=accounts;Username=eventbank;Password=eventbank;GSS Encryption Mode=Disable
    depends_on: *service-dependencies

  transfers:
    image: ghcr.io/marcelo-roman/eventbank-transfers:latest
    environment:
      <<: *service-environment
      ConnectionStrings__Transfers: Host=postgres;Database=transfers;Username=eventbank;Password=eventbank;GSS Encryption Mode=Disable
    depends_on: *service-dependencies

  cards:
    image: ghcr.io/marcelo-roman/eventbank-cards:latest
    environment:
      <<: *service-environment
      ConnectionStrings__Cards: Host=postgres;Database=cards;Username=eventbank;Password=eventbank;GSS Encryption Mode=Disable
    depends_on: *service-dependencies

  notifications:
    image: ghcr.io/marcelo-roman/eventbank-notifications:latest
    environment:
      <<: *service-environment
      ConnectionStrings__Notifications: Host=postgres;Database=notifications;Username=eventbank;Password=eventbank;GSS Encryption Mode=Disable
      Smtp__Host: mailpit
      Smtp__Port: "1025"
    depends_on: *service-dependencies

  gateway:
    image: ghcr.io/marcelo-roman/eventbank-gateway:latest
    environment:
      ReverseProxy__Clusters__accounts__Destinations__primary__Address: http://accounts:8080
      ReverseProxy__Clusters__transfers__Destinations__primary__Address: http://transfers:8080
      ReverseProxy__Clusters__customers__Destinations__primary__Address: http://customers:8080
      ReverseProxy__Clusters__cards__Destinations__primary__Address: http://cards:8080
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: http://notifications:8080
    ports:
      - "5100:8080"
    depends_on:
      - accounts
      - transfers
      - customers
      - cards
      - notifications

  shell:
    image: ghcr.io/marcelo-roman/eventbank-shell:latest
    environment:
      AUTHORITY: http://localhost:8180/realms/eventbank
      CLIENT_ID: eventbank-web
      ACCOUNTS_REMOTE_URL: http://localhost:3001/remoteEntry.js
      TRANSFERS_REMOTE_URL: http://localhost:3002/remoteEntry.js
      OPERATIONS_REMOTE_URL: http://localhost:3003/remoteEntry.js
      ONBOARDING_REMOTE_URL: http://localhost:3004/remoteEntry.js
      CARDS_REMOTE_URL: http://localhost:3005/remoteEntry.js
      BACKOFFICE_REMOTE_URL: http://localhost:3006/remoteEntry.js
    ports:
      - "3000:80"
    depends_on:
      - gateway

  mfe-accounts:
    image: ghcr.io/marcelo-roman/eventbank-mfe-accounts:latest
    ports:
      - "3001:80"

  mfe-transfers:
    image: ghcr.io/marcelo-roman/eventbank-mfe-transfers:latest
    ports:
      - "3002:80"

  mfe-operations:
    image: ghcr.io/marcelo-roman/eventbank-mfe-operations:latest
    ports:
      - "3003:80"

  mfe-onboarding:
    image: ghcr.io/marcelo-roman/eventbank-mfe-onboarding:latest
    ports:
      - "3004:80"

  mfe-cards:
    image: ghcr.io/marcelo-roman/eventbank-mfe-cards:latest
    ports:
      - "3005:80"

  mfe-backoffice:
    image: ghcr.io/marcelo-roman/eventbank-mfe-backoffice:latest
    ports:
      - "3006:80"

volumes:
  postgres-data:
